<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../css/contact.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio-Contact</title>
</head>

<body>
    <object data="header.html" width="100%" height="100"></object>
    
    <div id="form-container">

        <form id="boxes-container">
            <div id="top-section-container">
                <div id="box-1">
                    <div id="a-container">
                        <div class="input-container"><input placeholder="Firstname"/></div>
                        <div class="input-container"><input placeholder="Lastname"/></div>

                    </div>
                </div>

                <div id="box-2">
                    <div id="a-container">
                        <div class="input-container"><input placeholder="Email Address"/></div>
                        <div class="input-container"><input placeholder="Phone Number"/></div>
                    </div>
                </div>
            </div>

            <div id="below-section-container">
                <div id="box-3">

                    <div id="b-container">
                        <div id="message-container">
                            <textarea placeholder="Message"></textarea>
                        </div>

                        <div id="button-container">
                            <button>Submit</button>
                        </div>
                    </div>

                </div>
            </div>
        </form>

    </div>
</body>

</html>
